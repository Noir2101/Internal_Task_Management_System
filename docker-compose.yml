services:
  postgres:
    image: postgres:18
    container_name: itms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: itms
      POSTGRES_PASSWORD: itms
      POSTGRES_DB: itms
    ports:
      - "5433:5432" # host:container — 5433 để tránh đụng Postgres mặc định (5432) trên máy
    volumes:
      # pg:18 lưu data ở subdir theo major version → mount ở PARENT (không phải /data),
      # theo khuyến nghị image; nếu mount /data, container 18 từ chối khởi động.
      - itms_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itms -d itms"]
      interval: 5s
      timeout: 5s
      retries: 10

  # GĐ11 Slice 1 — Redis: shared store for the auth throttle counter. In-memory counters live in one
  # process, so N backend replicas would each allow the full limit (5 logins/min becomes 5×N).
  # This state is ephemeral (keys expire in 60s) → persistence off, no volume, no host port.
  redis:
    image: redis:8-alpine
    container_name: itms-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # GĐ10 Slice 1 — backend image (Dockerfile). Entrypoint: migrate deploy → seed-if-empty →
  # node dist/main. NOT exposed to host (web front-door lands in Slice 2). Env uses ${VAR:-demo}
  # substitution so `up` works with no .env; a project-dir .env overrides. DATABASE_URL is the
  # internal service host `postgres` (not a secret — mirrors the pg creds above).
  #
  # No container_name on purpose (GĐ11): compose refuses `--scale backend=N` when one is pinned,
  # and scaling is how the shared rate-limit store gets verified. Containers get itms-backend-1…N.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://itms:itms@postgres:5432/itms?schema=public
      # Empty/unset → in-memory throttle store AND no notification queue (dev + test path).
      # See src/auth/throttler-storage.ts and src/tasks/infrastructure/queue/notification-queue.ts.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # GĐ11 Slice 2 — overdue digest schedule, UTC. Default 01:00 UTC = 08:00 Vietnam time.
      # The schedule lives in Redis (BullMQ job scheduler), so N replicas still send ONE digest.
      OVERDUE_DIGEST_CRON: ${OVERDUE_DIGEST_CRON:-0 1 * * *}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-demo-only-not-a-real-secret-change-me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-7}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # GĐ10 Slice 2 — nginx front-door. Serves the built React SPA and reverse-proxies /api to
  # backend on ONE origin. The ONLY service published to the host (:8080). depends_on backend
  # healthy so the proxy target is ready.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: itms-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80" # host:container — single entry point
    healthcheck:
      # 127.0.0.1 not localhost: nginx listens on IPv4 only, but localhost resolves to ::1 first.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  itms_pgdata: