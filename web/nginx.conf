# ITMS front-door — GĐ10 Slice 2 (docs/10-deploy-plan.md §6).
# One origin: nginx serves the SPA static files and reverse-proxies /api to the backend.
# Three must-keeps: (1) no path rewrite, (2) forward X-Forwarded-*, (3) SPA fallback.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS. Needed because `proxy_pass` with a literal hostname resolves ONCE at
    # boot into a fixed implicit upstream that, measured here, does NOT get load-balanced across:
    # 8/8 requests landed on one replica. nginx does know the other address — killing the pinned
    # replica kept requests at 200 — so it holds the second only as failover, not as a share of
    # traffic. Net effect: `--scale backend=N` gives N containers but one serving them, silently.
    # valid=10s → replicas added while running get picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /api → backend. The original URI (incl. the /api/v1 prefix) is preserved: `$request_uri` is
    # the client's raw URI with query string. Keeping the prefix means the browser sees the refresh
    # cookie at Path=/api/v1/auth, so it rides /auth/refresh + /auth/logout; and Swagger at
    # /api/v1/docs is reachable through the same door. Rewriting the path would break these.
    location /api/ {
        # A VARIABLE here is what defers resolution to request time (and thus to `resolver` above);
        # a literal host would go back to resolve-once-at-boot. Round-robins across all replicas.
        set $itms_backend http://backend:3000;
        proxy_pass $itms_backend$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # backend has `trust proxy: 1` → throttle keys on the real client IP, not the proxy's.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any non-file path returns index.html so React Router handles the route
    # (a hard reload of /tasks must not 404).
    location / {
        try_files $uri /index.html;
    }
}
