# ITMS front-door — GĐ10 Slice 2 (docs/10-deploy-plan.md §6).
# One origin: nginx serves the SPA static files and reverse-proxies /api to the backend.
# Three must-keeps: (1) no path rewrite, (2) forward X-Forwarded-*, (3) SPA fallback.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # /api → backend. No trailing slash on proxy_pass → the original URI (incl. the /api/v1
    # prefix) is preserved. Keeping the prefix means the browser sees the refresh cookie at
    # Path=/api/v1/auth, so it rides /auth/refresh + /auth/logout; and Swagger at /api/v1/docs
    # is reachable through the same door. Rewriting the path would break these.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # backend has `trust proxy: 1` → throttle keys on the real client IP, not the proxy's.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any non-file path returns index.html so React Router handles the route
    # (a hard reload of /tasks must not 404).
    location / {
        try_files $uri /index.html;
    }
}
